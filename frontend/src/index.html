<!doctype html>
<html lang="en" data-theme="dark" data-font="md">
<head>
  <meta charset="utf-8">
  <title>Fan Hub Plus | One Universe. Every Fandom.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fan Hub Plus - the fandom universe for Anime, Gaming, Movies, TV Shows, K-Pop, Comics, Manga and Cosplay fans.">
  <meta name="theme-color" content="#07070C">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="preload" href="/fonts/Orbitron.woff" as="font" type="font/woff" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Kaushan+Script&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('fhp.theme'); if (t) document.documentElement.setAttribute('data-theme', t);
      var f = localStorage.getItem('fhp.font'); if (f) document.documentElement.setAttribute('data-font', f);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Fan Hub Plus needs JavaScript enabled to explore the multiverse.</noscript>
</body>
</html>
